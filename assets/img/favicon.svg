<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ROTF-1 sensor head. Filled shapes, no outlines — an outlined version
       turns to mush at 16px. Yellow stays an accent, as it is on the page. -->
  <rect width="64" height="64" rx="13" fill="#15171a"/>
  <!-- antenna -->
  <rect x="30" y="8" width="4" height="12" fill="#e8b60f"/>
  <circle cx="32" cy="8" r="4.6" fill="#e8b60f"/>
  <!-- head -->
  <rect x="11" y="18" width="42" height="33" rx="9" fill="#e3e4df"/>
  <!-- lens, knocked out of the head -->
  <circle cx="32" cy="34.5" r="9.5" fill="#15171a"/>
  <circle cx="32" cy="34.5" r="4.4" fill="#2b4c7e"/>
</svg>
